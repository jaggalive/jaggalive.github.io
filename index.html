<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Jagga Live</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* GRID BACKGROUND */

.grid{
  position:absolute;
  inset:0;
  background-image:
  linear-gradient(rgba(255,0,0,0.08) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,0,0,0.08) 1px, transparent 1px);
  background-size:60px 60px;
}

/* MAIN CONTENT */

.container{
  position:relative;
  z-index:2;
  text-align:center;
  padding:20px;
}

.logo{
  width:130px;
  margin-bottom:30px;
  animation:pulse 1.5s infinite;
  filter:drop-shadow(0 0 15px rgba(255,0,0,0.5));
}

h1{
  font-size:52px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:15px;
}

.sub{
  color:#777;
  letter-spacing:5px;
  margin-bottom:40px;
  font-size:14px;
}

.tap{
  display:inline-block;
  padding:14px 30px;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;
  color:#ff2d2d;
  text-decoration:none;
  font-size:18px;
  transition:0.3s;
  background:rgba(255,255,255,0.03);
}

.tap:hover{
  background:#ff2d2d;
  color:#fff;
}

.note{
  margin-top:25px;
  color:#666;
  font-size:13px;
}

@keyframes pulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.08); }
  100%{ transform:scale(1); }
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="container">

<img
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg"
alt="YouTube"
/>

<h1>OPENING YOUTUBE</h1>

<div class="sub">
LAUNCHING JAGGA LIVE...
</div>

<a
id="openButton"
class="tap"
href="#"
>
OPEN NOW
</a>

<div class="note">
If YouTube doesn't open automatically, tap the button above.
</div>

</div>

<script>

/* =========================================
   CHANGE ONLY THIS LINK WHEN NEEDED
========================================= */

const CURRENT_LINK =
"https://www.youtube.com/live/MpXnmMktjfY?si=MeLPjUi_ol35KEkK";

/* =========================================
   AUTO SYSTEM
========================================= */

const cleanLink = CURRENT_LINK
.replace("https://", "")
.replace("http://", "");

const intentLink =
`intent://${cleanLink}#Intent;scheme=https;package=com.google.android.youtube;end`;

document.getElementById("openButton").href = intentLink;

function openYouTube() {

  // Try opening YouTube app first
  window.location.href = intentLink;

  // Fallback to browser
  setTimeout(() => {
    window.location.href = CURRENT_LINK;
  }, 1800);

}

/* BETTER MOBILE LOAD SYSTEM */

window.addEventListener("load", () => {
  setTimeout(openYouTube, 500);
});

</script>

</body>
</html>
