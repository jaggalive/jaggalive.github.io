<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Jagga Live</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* GRID */

.grid{
  position:absolute;
  inset:0;
  background-image:
  linear-gradient(rgba(255,120,0,0.08) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,120,0,0.08) 1px, transparent 1px);
  background-size:60px 60px;
  z-index:1;
}

/* FACE SVG BACKGROUND */

.face-bg{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}

.face-bg svg{
  width:100%;
  height:100%;
}

/* CONTENT */

.container{
  position:relative;
  z-index:2;
  text-align:center;
  padding:20px;
}

.logo{
  width:130px;
  margin-bottom:30px;
  animation:pulse 1.5s infinite;
  filter:drop-shadow(0 0 15px rgba(255,120,0,0.5));
}

h1{
  font-size:52px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:15px;
}

.sub{
  color:#aaa;
  letter-spacing:5px;
  margin-bottom:40px;
  font-size:14px;
}

.tap{
  display:inline-block;
  padding:14px 30px;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;
  color:#ff9800;
  text-decoration:none;
  font-size:18px;
  transition:0.3s;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(8px);
}

.tap:hover{
  background:#ff9800;
  color:#000;
}

.note{
  margin-top:25px;
  color:#777;
  font-size:13px;
}

@keyframes pulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.08); }
  100%{ transform:scale(1); }
}

</style>
</head>

<body>

<!-- FACE SVG -->

<div class="face-bg">

<svg
viewBox="0 0 800 1200"
xmlns="http://www.w3.org/2000/svg"
preserveAspectRatio="xMidYMid slice"
>

<defs>

<filter id="glow">
  <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
  <feMerge>
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffb347"/>
  <stop offset="100%" stop-color="#ff6a00"/>
</linearGradient>

</defs>

<g opacity="0.20">

<!-- HAIR -->
<path
d="
M210 240
Q250 80 400 90
Q560 90 600 240
Q590 180 540 150
Q500 120 430 110
Q340 100 280 140
Q220 180 210 240
"
fill="#ff9800"
/>

<!-- FACE -->
<path
d="
M260 260
Q260 170 400 170
Q540 170 540 260
L540 500
Q530 700 400 760
Q270 700 260 500
Z
"
fill="url(#bgFade)"
filter="url(#glow)"
/>

<!-- BEARD -->
<path
d="
M290 520
Q330 620 400 650
Q470 620 510 520
Q470 720 400 760
Q330 720 290 520
"
fill="#111"
/>

<!-- EYES -->
<ellipse cx="340" cy="360" rx="28" ry="12" fill="#111"/>
<ellipse cx="460" cy="360" rx="28" ry="12" fill="#111"/>

<!-- NOSE -->
<path
d="
M390 390
Q400 450 410 390
"
stroke="#111"
stroke-width="8"
stroke-linecap="round"
fill="none"
/>

<!-- MUSTACHE -->
<path
d="
M340 500
Q400 470 460 500
"
stroke="#111"
stroke-width="14"
stroke-linecap="round"
fill="none"
/>

<!-- MOUTH -->
<path
d="
M360 560
Q400 585 440 560
"
stroke="#111"
stroke-width="10"
stroke-linecap="round"
fill="none"
/>

</g>

</svg>

</div>

<!-- GRID -->

<div class="grid"></div>

<!-- MAIN CONTENT -->

<div class="container">

<img
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg"
alt="YouTube"
/>

<h1>OPENING YOUTUBE</h1>

<div class="sub">
LAUNCHING JAGGA LIVE...
</div>

<a
id="openButton"
class="tap"
href="#"
>
OPEN NOW
</a>

<div class="note">
If YouTube doesn't open automatically, tap the button above.
</div>

</div>

<script>

/* =========================================
   CHANGE ONLY THIS LINK
========================================= */

const CURRENT_LINK =
"https://youtube.com/live/dzxXSLyfJVw";

/* =========================================
   AUTO SYSTEM
========================================= */

const cleanLink = CURRENT_LINK
.replace("https://", "")
.replace("http://", "");

const intentLink =
`intent://${cleanLink}#Intent;scheme=https;package=com.google.android.youtube;end`;

document.getElementById("openButton").href = intentLink;

function openYouTube() {

  // Open YouTube app first
  window.location.href = intentLink;

  // Fallback
  setTimeout(() => {
    window.location.href = CURRENT_LINK;
  }, 1800);

}

window.onload = () => {
  openYouTube();
};

</script>

</body>
</html>
